[project]
name = "campusmatch"
version = "0.1.0"
description = "CampusMatch - a bright, interest-based campus dating platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosmtplib>=3.0.2",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "bcrypt<4.1",
    "email-validator>=2.2.0",
    "fastapi>=0.115.0",
    "langchain-openai>=0.3.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.7.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.34.0",
    "websockets>=14.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.uv]
default-groups = ["dev"]
